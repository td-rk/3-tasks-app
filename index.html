<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>3タスク方式</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #20242b;
      --muted: #68717d;
      --line: #e1e5ea;
      --accent: #315f9d;
      --accent-soft: #eaf1fa;
      --disabled: #aab2bd;
      --locked: #f0f2f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      padding: 32px 16px 48px;
    }
    main { width: min(100%, 620px); margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { font-size: 1.65rem; letter-spacing: .02em; margin: 0 0 7px; }
    .subtitle { color: var(--muted); font-size: .92rem; margin: 0; }
    .summary {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 16px; margin-bottom: 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    }
    .summary-label { color: var(--muted); font-size: .88rem; }
    .summary-value { font-weight: 700; font-variant-numeric: tabular-nums; }
    #task-list { display: grid; gap: 12px; }
    .task {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px;
    }
    .task-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .task-number { font-size: .82rem; color: var(--muted); font-weight: 650; }
    .name-input {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--text); padding: 12px;
      font: inherit; font-size: 1rem; outline: none;
    }
    .name-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #315f9d1c; }
    .pomodoro-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 13px;
    }
    .pomodoro-label { color: var(--muted); font-size: .9rem; }
    .counter { display: flex; align-items: center; gap: 12px; }
    .counter-value { min-width: 76px; text-align: center; font-weight: 700; }
    .counter-value small { display: block; color: var(--muted); font-weight: 400; font-size: .75rem; }
    button {
      font: inherit; border: 0; border-radius: 8px; cursor: pointer;
      min-height: 40px; padding: 8px 15px;
    }
    .step-button {
      width: 40px; height: 40px; padding: 0; font-size: 1.25rem;
      color: var(--text); background: #eef1f5;
    }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .primary {
      width: 100%; margin-top: 18px; min-height: 48px;
      background: var(--accent); color: white; font-weight: 650;
    }
    .primary:disabled { background: var(--disabled); opacity: 1; }
    .hint { min-height: 1.4em; margin: 10px 2px 0; color: var(--muted); font-size: .82rem; }
    .locked-banner {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px; margin-bottom: 14px;
      background: var(--locked); color: #505966; border: 1px solid var(--line);
      border-radius: 10px; font-size: .88rem;
    }
    .lock-icon { font-size: 1rem; }
    .task.locked { background: #fafbfc; }
    .task.locked .task-name { font-weight: 650; overflow-wrap: anywhere; }
    .task.locked .task-duration { color: var(--muted); font-size: .9rem; margin-top: 6px; }
    .completion {
      display: flex; align-items: center; gap: 12px; margin-top: 15px;
      padding-top: 13px; border-top: 1px solid var(--line);
      cursor: pointer; font-size: .92rem;
    }
    .completion input { width: 20px; height: 20px; accent-color: var(--accent); }
    .task.done { opacity: .68; }
    .task.done .task-name { text-decoration: line-through; }
    .end-button { background: #273342; }
    .footnote { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 18px; }
    @media (max-width: 420px) {
      body { padding: 24px 13px 36px; }
      h1 { font-size: 1.45rem; }
      .task { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>3タスク方式</h1>
      <p class="subtitle" id="subtitle">今日取り組む3つのタスクを決めよう。</p>
    </header>
    <section class="summary" aria-live="polite">
      <span class="summary-label">合計所要時間</span>
      <span class="summary-value" id="total">0 / 6 ポモドーロ</span>
    </section>
    <section id="task-list" aria-label="タスク一覧"></section>
    <div id="actions"></div>
    <p class="footnote">1ポモドーロ = 25分作業 + 5分休憩（30分）</p>
  </main>

  <script>
    const STORAGE_KEY = "three-task-method-v1";
    const emptyState = () => ({
      locked: false,
      tasks: Array.from({ length: 3 }, () => ({ name: "", pomodoros: 0, done: false }))
    });

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || !Array.isArray(saved.tasks) || saved.tasks.length !== 3) return emptyState();
        return {
          locked: Boolean(saved.locked),
          tasks: saved.tasks.map(task => ({
            name: typeof task.name === "string" ? task.name : "",
            pomodoros: Number.isInteger(task.pomodoros) && task.pomodoros >= 0 && task.pomodoros <= 3 ? task.pomodoros : 0,
            done: Boolean(task.done)
          }))
        };
      } catch {
        return emptyState();
      }
    }

    let state = loadState();
    const taskList = document.getElementById("task-list");
    const actions = document.getElementById("actions");
    const totalElement = document.getElementById("total");
    const subtitle = document.getElementById("subtitle");

    const totalPomodoros = () => state.tasks.reduce((sum, task) => sum + task.pomodoros, 0);
    const durationText = count => {
      const minutes = count * 30;
      return minutes < 60 ? `${minutes}分` : `${Math.floor(minutes / 60)}時間${minutes % 60 ? `${minutes % 60}分` : ""}`;
    };
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const escapeHtml = value => value.replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    function render() {
      const total = totalPomodoros();
      totalElement.textContent = `${total} / 6 ポモドーロ（${durationText(total)}）`;

      if (!state.locked) {
        subtitle.textContent = "今日取り組む3つのタスクを決めよう。";
        taskList.innerHTML = state.tasks.map((task, index) => {
          const canAdd = task.pomodoros < 3 && total < 6;
          const canSubtract = task.pomodoros > 0;
          return `
            <article class="task">
              <div class="task-top"><span class="task-number">TASK ${index + 1}</span></div>
              <input class="name-input" id="task-name-${index}" data-name="${index}"
                type="text" maxlength="80" autocomplete="off"
                placeholder="タスク名を入力" aria-label="タスク${index + 1}の名前"
                value="${escapeHtml(task.name)}">
              <div class="pomodoro-row">
                <span class="pomodoro-label">所要ポモドーロ数</span>
                <div class="counter">
                  <button class="step-button" type="button" data-step="-1" data-index="${index}"
                    aria-label="タスク${index + 1}のポモドーロ数を減らす" ${canSubtract ? "" : "disabled"}>−</button>
                  <span class="counter-value">${task.pomodoros === 0 ? "未設定" : `${task.pomodoros} ポモドーロ`}
                    <small>${task.pomodoros === 0 ? " " : durationText(task.pomodoros)}</small></span>
                  <button class="step-button" type="button" data-step="1" data-index="${index}"
                    aria-label="タスク${index + 1}のポモドーロ数を増やす" ${canAdd ? "" : "disabled"}>＋</button>
                </div>
              </div>
            </article>`;
        }).join("");

        const validNames = state.tasks.every(task => task.name.trim().length > 0);
        const validCounts = state.tasks.every(task => task.pomodoros >= 1 && task.pomodoros <= 3);
        const validTotal = total <= 6;
        const canConfirm = validNames && validCounts && validTotal;
        actions.innerHTML = `
          <button class="primary" id="confirm" type="button" ${canConfirm ? "" : "disabled"}>3つのタスクを確定する</button>
          <p class="hint">${canConfirm ? "確定すると、タスクの追加・削除・編集はできなくなります。" : "タスク名とポモドーロ数を3つすべて入力してください。合計は6以下です。"}</p>`;
      } else {
        subtitle.textContent = "確定した3つのタスクに取り組もう。";
        const allDone = state.tasks.every(task => task.done);
        taskList.innerHTML = `
          <div class="locked-banner"><span class="lock-icon">🔒</span><span>確定済み — タスクの編集はできません</span></div>
          ${state.tasks.map((task, index) => `
            <article class="task locked ${task.done ? "done" : ""}">
              <div class="task-top"><span class="task-number">TASK ${index + 1}</span></div>
              <div class="task-name">${escapeHtml(task.name)}</div>
              <div class="task-duration">${task.pomodoros} ポモドーロ ・ ${durationText(task.pomodoros)}</div>
              <label class="completion">
                <input type="checkbox" data-done="${index}" ${task.done ? "checked" : ""}>
                <span>完了</span>
              </label>
            </article>`).join("")}`;
        actions.innerHTML = `
          <button class="primary end-button" id="finish" type="button" ${allDone ? "" : "disabled"}>終了</button>
          <p class="hint">${allDone ? "3つすべて完了しました。終了して次の3タスクを登録できます。" : "3つすべてにチェックを入れると終了できます。"}</p>`;
      }
    }

    taskList.addEventListener("input", event => {
      const index = event.target.dataset.name;
      if (index === undefined || state.locked) return;
      state.tasks[Number(index)].name = event.target.value;
      save();
      const confirmButton = document.getElementById("confirm");
      if (confirmButton) {
        const valid = state.tasks.every(task => task.name.trim() && task.pomodoros >= 1) && totalPomodoros() <= 6;
        confirmButton.disabled = !valid;
        const hint = actions.querySelector(".hint");
        if (hint) hint.textContent = valid
          ? "確定すると、タスクの追加・削除・編集はできなくなります。"
          : "タスク名とポモドーロ数を3つすべて入力してください。合計は6以下です。";
      }
    });

    taskList.addEventListener("click", event => {
      const button = event.target.closest("button[data-step]");
      if (!button || state.locked) return;
      const index = Number(button.dataset.index);
      const change = Number(button.dataset.step);
      const task = state.tasks[index];
      const next = task.pomodoros + change;
      if (next < 0 || next > 3 || (change > 0 && totalPomodoros() >= 6)) return;
      task.pomodoros = next;
      save();
      render();
    });

    taskList.addEventListener("change", event => {
      const index = event.target.dataset.done;
      if (index === undefined || !state.locked) return;
      state.tasks[Number(index)].done = event.target.checked;
      save();
      render();
    });

    actions.addEventListener("click", event => {
      if (event.target.id === "confirm" && !state.locked) {
        const valid = state.tasks.every(task => task.name.trim() && task.pomodoros >= 1 && task.pomodoros <= 3)
          && totalPomodoros() <= 6;
        if (!valid) return;
        state.tasks.forEach(task => { task.name = task.name.trim(); task.done = false; });
        state.locked = true;
        save();
        render();
      }
      if (event.target.id === "finish" && state.locked && state.tasks.every(task => task.done)) {
        state = emptyState();
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
